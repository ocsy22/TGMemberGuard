# Replace admin.example.com with your domain. Configure HTTPS before public use.
# Example: install nginx + certbot, then certbot --nginx -d admin.example.com
# After HTTPS works, set web.behind_proxy=true and web.secure_cookie=true.
server {
    listen 80;
    server_name admin.example.com;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
