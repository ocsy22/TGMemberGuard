<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次设置 · TG会员管理</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><main class="login-card"><div class="brand-icon">TG</div><p class="eyebrow">WELCOME / FIRST SETUP</p><h1>创建管理员账号</h1><p class="muted">安装已完成。创建账号后，即可在后台配置机器人、频道和管理员通知。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>管理员用户名<input name="username" autocomplete="username" required minlength="3" maxlength="40" placeholder="例如 admin" autofocus></label><label>密码（至少12位）<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><label>确认密码<input name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label>{% if error %}<p class="error">{{ error }}</p>{% endif %}<button class="primary full" type="submit">创建账号并进入后台 →</button></form><p class="footnote">首次设置完成后，此入口自动关闭。无默认密码。</p></main></body></html>
