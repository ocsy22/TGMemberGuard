<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · TG会员管理</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-body"><main class="login-card"><div class="brand-icon">TG</div><p class="eyebrow">MEMBER GUARD / CONTROL ROOM</p><h1>会员管理后台</h1><p class="muted">登录后管理频道、名单和管理员通知。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>管理员账号<input name="username" autocomplete="username" required maxlength="40" autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>{% if error %}<p class="error">{{ error }}</p>{% endif %}<button class="primary full" type="submit">登录管理后台 →</button></form><p class="footnote">TGMemberGuard 2.1.0 · Ubuntu Server</p></main></body></html>
